name: Container

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/ngenetzky_devcontainer_debian.bash'
      - '.dockerignore'
      - '.github/workflows/container.yml'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/ngenetzky_devcontainer_debian.bash'
      - '.dockerignore'
      - '.github/workflows/container.yml'

jobs:
  build-push:
    # NOTE: Change 'ubuntu-latest' to 'self-hosted' (or a custom label) for self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # NOTE: setup-qemu is required for multi-platform builds (linux/arm64) on amd64 hosts.
      # On self-hosted ARM runners this step can be removed and 'platforms' scoped to native arch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ngenetzky/home:latest
